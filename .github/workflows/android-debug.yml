name: Build DANA installable APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get DANA source
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 35 and tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify source, security and AI gateway tests
        run: |
          python3 scripts/verify_static.py
          python3 -m unittest discover -s gateway/tests -v
          python3 scripts/preflight.py
      - name: Install pinned Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Gradle runtime
        run: gradle --version
      - name: Compile, test, lint and build installable debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Generate SHA-256 checksum
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
      - name: Upload APK (installable for testing)
        uses: actions/upload-artifact@v4
        with:
          name: DANA-v1.3.0-rc4-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
