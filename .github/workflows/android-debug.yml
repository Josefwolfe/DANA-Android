name: Build DANA installable APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get DANA source
        uses: actions/checkout@v7
      - name: Install JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'
      - name: Install Android API 35 and Build Tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install pinned Android NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Fetch official whisper.cpp v1.8.4
        run: bash scripts/fetch_whisper_cpp.sh
      - name: Verify source and tests
        run: |
          python3 scripts/verify_static.py
          python3 -m unittest discover -s gateway/tests -v
          python3 scripts/preflight.py
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Gradle
        run: gradle --version
      - name: Build DANA Debug APK
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Generate APK checksum
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
      - name: Upload DANA APK
        uses: actions/upload-artifact@v4
        with:
          name: DANA-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
