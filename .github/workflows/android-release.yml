name: Build signed DANA release APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
     - uses: android-actions/setup-android@v4
  with:
    packages: 'platform-tools'
      - run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore signing keystore from GitHub secret
        env:
          DANA_RELEASE_KEYSTORE_B64: ${{ secrets.DANA_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$DANA_RELEASE_KEYSTORE_B64"
          printf '%s' "$DANA_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/dana-release.jks"
      - name: Verify source and bootstrap Gradle
        run: |
          python3 scripts/verify_static.py
          python3 -m unittest discover -s gateway/tests -v
          python3 scripts/preflight.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed release
        env:
          DANA_KEYSTORE_PATH: ${{ runner.temp }}/dana-release.jks
          DANA_KEYSTORE_PASSWORD: ${{ secrets.DANA_KEYSTORE_PASSWORD }}
          DANA_KEY_ALIAS: ${{ secrets.DANA_KEY_ALIAS }}
          DANA_KEY_PASSWORD: ${{ secrets.DANA_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Verify APK signature and checksum
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: DANA-v1.3.0-rc4-signed-release-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
